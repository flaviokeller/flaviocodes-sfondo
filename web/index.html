<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sfondo</title>
    <style>
      :root {
        --bg: #101114;
        --panel: #17181c;
        --line: #2a2c33;
        --text: #e6e6ea;
        --muted: #8b8d98;
        --accent: #8ab4ff;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); }
      .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100vh; }

      aside { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
      h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: 0.02em; }
      label, fieldset { display: grid; gap: 4px; color: var(--muted); border: 0; padding: 0; margin: 0; min-width: 0; }
      legend { padding: 0; margin-bottom: 4px; }
      select, input, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
      button { cursor: pointer; }
      button:hover, select:hover, input:hover { border-color: #3d404a; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .row { display: flex; gap: 6px; align-items: center; }
      .row > * { flex: 1; }
      .row > input { width: 100%; }
      .row > .times { flex: 0; color: var(--muted); }
      .check { display: flex; gap: 8px; align-items: center; color: var(--text); }
      .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
      .seg button { flex: 1; border: 0; border-radius: 0; background: none; color: var(--muted); }
      .seg button[aria-pressed='true'] { background: var(--line); color: var(--text); }
      .primary { background: var(--accent); color: #0b1020; border-color: var(--accent); font-weight: 600; margin-top: auto; }
      .primary:disabled { opacity: 0.6; cursor: progress; }
      input:disabled, button:disabled:not(.primary) { opacity: 0.4; cursor: default; }
      [hidden] { display: none !important; }

      main { position: relative; overflow: auto; padding: 24px; }
      #stage { width: 100%; height: 100%; display: grid; place-items: center; }
      #stage.grid { display: flex; flex-wrap: wrap; gap: 28px 20px; align-content: flex-start; justify-content: center; height: auto; }
      .frame { position: relative; overflow: hidden; box-shadow: 0 6px 28px #0009; line-height: 0; }
      .frame canvas { width: 100%; height: 100%; display: block; }
      .frame .overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      figure { margin: 0; display: grid; gap: 8px; justify-items: center; }
      figure button { all: unset; cursor: pointer; display: block; }
      figure button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      figcaption { color: var(--muted); font-size: 12px; text-align: center; }
      .error { color: #ff8a8a; max-width: 60ch; white-space: pre-wrap; }

      @media (max-width: 720px) {
        .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100vh; }
        aside { border-right: 0; border-bottom: 1px solid var(--line); }
        main { min-height: 70vh; }
      }

      body.bare { background: none; }
      .bare .app { display: block; height: auto; }
      .bare aside { display: none; }
      .bare main { padding: 0; overflow: visible; }
      .bare #stage { display: block; }
      .bare #stage canvas { display: block; }
    </style>
  </head>
  <body>
    <div class="app">
      <aside>
        <h1>sfondo</h1>
        <label>Style <select id="style"></select></label>
        <label>Palette <select id="palette"></select></label>
        <label>Device <select id="device"></select></label>
        <div class="row" id="custom" hidden>
          <input id="cw" type="number" min="16" max="16384" aria-label="Custom width" />
          <span class="times">×</span>
          <input id="ch" type="number" min="16" max="16384" aria-label="Custom height" />
        </div>
        <fieldset>
          <legend>Seed</legend>
          <div class="row">
            <input id="seed" type="number" min="0" step="1" aria-label="Seed" />
            <button id="randomise" type="button">Randomise</button>
          </div>
        </fieldset>
        <label class="check"><input id="overlay" type="checkbox" /> iOS lock screen overlay</label>
        <fieldset>
          <legend>View</legend>
          <div class="seg" role="group" aria-label="View">
            <button type="button" data-view="single" aria-pressed="true">Single</button>
            <button type="button" data-view="grid" aria-pressed="false">All devices</button>
          </div>
        </fieldset>
        <button id="download" class="primary" type="button">Download PNG</button>
      </aside>
      <main><div id="stage"></div></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
